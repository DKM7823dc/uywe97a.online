<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp 随机跳转</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
    color: #fff;
    padding: 20px;
  }
  .card {
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.3);
    backdrop-filter: blur(10px);
    border-radius: 18px;
    padding: 34px 28px;
    max-width: 400px;
    width: 100%;
    text-align: center;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
  }
  h1 { font-size: 20px; margin: 0 0 12px; font-weight: 600; }
  .tip { font-size: 14px; opacity: 0.9; margin-bottom: 18px; line-height: 1.6; }
  .num { font-size: 16px; opacity: 0.95; word-break: break-all; margin: 10px 0 18px; }
  .status { font-size: 13px; min-height: 18px; opacity: 0.85; }
  a.fallback {
    display: inline-block;
    margin-top: 16px;
    padding: 10px 18px;
    background: #fff;
    color: #128C7E;
    border-radius: 8px;
    font-weight: 600;
    text-decoration: none;
    font-size: 14px;
  }
</style>
</head>
<body>

<div class="card">
  <h1>正在跳转到 WhatsApp…</h1>
  <p class="tip">已随机选择一个号码，正在打开</p>
  <div class="num" id="num"></div>
  <div class="status" id="status"></div>
  <a class="fallback" id="fallback" href="#">如果没有自动跳转，请点这里</a>
</div>

<script>
(function () {
  /* ============ 配置区 ============ */

  // 需要随机跳转的 WhatsApp 号码（纯数字，不带 +、空格、横线）
  var WHATSAPP_NUMBERS = [
    '11111111111',
    '22222222222'
    // 有第三个号码就直接加在这里，例如： '33333333333'
  ];

  // 可选的预填消息（不需要就留空字符串 ''）
  var PRESET_TEXT = '';

  /* ================================ */

  var numEl      = document.getElementById('num');
  var statusEl   = document.getElementById('status');
  var fallbackEl = document.getElementById('fallback');

  function buildUrl(number) {
    var url = 'https://wa.me/' + number;
    if (PRESET_TEXT) {
      url += '?text=' + encodeURIComponent(PRESET_TEXT);
    }
    return url;
  }

  function pickRandomNumber() {
    var idx = Math.floor(Math.random() * WHATSAPP_NUMBERS.length);
    return WHATSAPP_NUMBERS[idx];
  }

  if (!WHATSAPP_NUMBERS.length) {
    statusEl.textContent = '未配置任何号码，请填写 WHATSAPP_NUMBERS';
    fallbackEl.style.display = 'none';
    return;
  }

  // 立即随机选号并跳转
  var targetNumber = pickRandomNumber();
  var targetUrl = buildUrl(targetNumber);

  numEl.textContent = '+ ' + targetNumber;
  statusEl.textContent = '正在打开该号码的会话…';
  fallbackEl.href = targetUrl;

  // 使用 replace，这样按返回键不会又回到这个跳转页导致循环
  window.location.replace(targetUrl);
})();
</script>

</body>
</html>
