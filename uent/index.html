button,

}

.ref-percent {
  font-size: 3rem;
  font-weight: 900;
  color: var(--cyan);
  line-height: 1;
  letter-spacing: -0.06em;
}

.career-list {
  display: grid;
  gap: 10px;
}

.career-item {
  display: grid;
  grid-template-columns: minmax(120px, 0.45fr) minmax(0, 1fr) minmax(110px, 0.35fr);
  gap: 12px;
  align-items: center;
  padding: 14px;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  background: rgba(255,255,255,0.04);
}

.career-item strong {
  color: #ffffff;
}

.career-item span {
  color: var(--muted);
}

.career-item b {
  color: #7af0b6;
  text-align: right;
}

.steps {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
}

.step-card {
  padding: 22px;
}

.step-number {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: rgba(126,224,255,0.12);
  color: var(--cyan);
  font-weight: 900;
  margin-bottom: 18px;
}

.faq-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
}

.faq-item {
  overflow: hidden;
}

.faq-item summary {
  min-height: 72px;
  padding: 18px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  cursor: pointer;
  list-style: none;
  color: #ffffff;
  font-weight: 800;
  font-size: 18px;
}

.faq-item summary::-webkit-details-marker {
  display: none;
}

.faq-item summary:focus-visible {
  outline: 2px solid #8ad9ff;
  outline-offset: -3px;
}

.faq-question {
  min-width: 0;
}

.faq-indicator {
  width: 30px;
  height: 30px;
  flex: 0 0 30px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(126,224,255,0.28);
  border-radius: 50%;
  background: rgba(126,224,255,0.08);
  color: var(--cyan);
}

.faq-indicator::before {
  content: "+";
  font-size: 22px;
  font-weight: 700;
  line-height: 1;
}

.faq-item[open] {
  border-color: rgba(126,224,255,0.28);
}

.faq-item[open] .faq-indicator::before {
  content: "−";
}

.faq-answer {
  padding: 0 20px 20px;
}

.contact-band {
  position: relative;
  overflow: hidden;
  padding: 76px 0;
  background:
    radial-gradient(circle at top left, rgba(58,141,255,0.18), transparent 24%),
    radial-gradient(circle at bottom right, rgba(72,211,255,0.12), transparent 32%),
    linear-gradient(135deg, #07131d 0%, #0a1b2b 45%, #0b2435 100%);
  color: #ffffff;
}

.contact-panel {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 24px;
  align-items: center;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 22px;
  padding: 28px;
  background: rgba(255,255,255,0.04);
  box-shadow: var(--shadow);
}

.contact-panel p {
  color: var(--muted);
  margin: 10px 0 0;
  line-height: 1.7;
}

.contact-buttons {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.contact-button img,
.float-contact img,
.modal-choice img {
  width: 22px;
  height: 22px;
  object-fit: contain;
}

.float-stack {
  position: fixed;
  right: 18px;
  bottom: 18px;
  z-index: 35;
  display: grid;
  gap: 10px;
}

.float-contact {
  width: 58px;
  height: 58px;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  background: rgba(9,21,31,0.9);
  display: grid;
  place-items: center;
  box-shadow: var(--shadow);
  backdrop-filter: blur(12px);
  cursor: pointer;
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: grid;
  place-items: center;
  padding: 20px;
  background: rgba(3, 7, 18, 0.6);
}

.modal-backdrop[hidden] {
  display: none;
}

.modal {
  width: min(440px, 100%);
  background: linear-gradient(180deg, rgba(9,21,31,0.96), rgba(12,26,38,0.96));
  border-radius: 20px;
  box-shadow: 0 28px 80px rgba(0, 0, 0, 0.28);
  border: 1px solid rgba(255,255,255,0.08);
  overflow: hidden;
  color: #ffffff;
  backdrop-filter: blur(16px);
}

.modal-head {
  padding: 22px 22px 0;
  display: flex;
  align-items: start;
  justify-content: space-between;
  gap: 18px;
}

.modal-head h3 {
  margin: 0;
  font-size: 24px;
}

.modal-close {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.04);
  color: #ffffff;
  cursor: pointer;
}

.modal p {
  color: var(--muted);
  line-height: 1.65;
  margin: 10px 22px 0;
}

.modal-choices {
  display: grid;
  gap: 10px;
  padding: 22px;
}

.modal-choice {
  min-height: 54px;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 16px;
  background: rgba(255,255,255,0.04);
  color: #ffffff;
  cursor: pointer;
  font-weight: 800;
}

/* Final visual direction: editorial canvas with an ink-and-lime product system. */
:root {
  color-scheme: light;
  --bg: #f3f0e8;
  --bg-2: #e8e4d9;
  --bg-3: #d9e7c8;
  --panel: #ffffff;
  --panel-strong: #142b3d;
  --panel-soft: rgba(20, 43, 61, 0.07);
  --line: rgba(20, 43, 61, 0.16);
  --text: #142b3d;
  --muted: #5d6870;
  --muted-2: #79817f;
  --blue: #b9e83d;
  --blue-strong: #8fc420;
  --cyan: #e76845;
  --green: #78a825;
  --amber: #f2aa3c;
  --shadow: 0 20px 50px rgba(20, 43, 61, 0.12);
  --radius: 8px;
  --radius-sm: 5px;
  --container: min(1180px, calc(100% - 36px));
  font-family: Georgia, "Times New Roman", serif;
}

body {
  background: var(--bg);
  color: var(--text);
}

.site-shell {
  background: var(--bg);
}

.topbar {
  border-bottom: 1px solid var(--line);
  background: rgba(243, 240, 232, 0.9);
  backdrop-filter: blur(18px);
}

.topbar-inner {
  min-height: 82px;
}

.brand {
  color: var(--text);
  letter-spacing: -0.03em;
}

.brand img {
  filter: none;
}

.brand span {
  color: var(--text);
  font-size: 23px;
}

.nav {
  color: #68716d;
  font-family: Arial, sans-serif;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.nav a:hover,
.nav a:focus-visible {
  color: var(--cyan);
}

.lang-button,
.ghost-button,
.primary-button,
.plain-button {
  border-radius: 4px;
  font-family: Arial, sans-serif;
  font-size: 12px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.lang-button,
.ghost-button {
  background: transparent;
  border-color: var(--line);
  color: var(--text);
}

.primary-button {
  background: var(--blue);
  border-color: var(--text);
  color: var(--text);
  box-shadow: 4px 4px 0 var(--text);
}

.primary-button:hover {
  background: var(--blue-strong);
  box-shadow: 2px 2px 0 var(--text);
}

.ghost-button:hover {
  border-color: var(--text);
  background: var(--panel);
}

.hero {
  min-height: 760px;
  background:
    linear-gradient(90deg, rgba(243, 240, 232, 0.96) 0 56%, rgba(243, 240, 232, 0.1) 82%),
    linear-gradient(135deg, #f3f0e8 0%, #e7ead8 100%);
  color: var(--text);
}

.hero::before {
  background:
    linear-gradient(90deg, transparent 0 56%, rgba(20, 43, 61, 0.1) 56% 56.2%, transparent 56.2%),
    linear-gradient(rgba(20, 43, 61, 0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(20, 43, 61, 0.05) 1px, transparent 1px);
  background-size: auto, 32px 32px, 32px 32px;
}

.hero::after {
  background: var(--text);
}

.hero-grid {
  background:
    linear-gradient(142deg, transparent 0 59%, rgba(231, 104, 69, 0.2) 59% 60%, transparent 60%),
    linear-gradient(38deg, transparent 0 73%, rgba(185, 232, 61, 0.38) 73% 74%, transparent 74%);
}

.hero-bg-logo {
  right: 4vw;
  top: 130px;
  width: min(540px, 46vw);
  opacity: 0.2;
  filter: grayscale(1) contrast(1.2);
}

.hero-content {
  padding: 112px 0 70px;
}

.eyebrow {
  border: 0;
  border-radius: 0;
  padding: 0;
  color: var(--cyan);
  background: transparent;
  font-family: Arial, sans-serif;
  font-size: 11px;
  letter-spacing: 0.16em;
}

.eyebrow::before {
  content: "///";
  margin-right: 8px;
  color: var(--blue-strong);
}

.hero-title {
  max-width: 760px;
  margin-top: 20px;
  color: var(--text);
  font-size: clamp(3.5rem, 7vw, 7.5rem);
  font-weight: 400;
  letter-spacing: -0.08em;
  line-height: 0.9;
}

.hero-title span {
  display: block;
  color: var(--cyan);
  font-style: italic;
}

.hero-copy {
  max-width: 530px;
  margin-top: 30px;
  color: #536069;
  font-family: Arial, sans-serif;
  font-size: 16px;
  line-height: 1.8;
}

.hero-actions {
  margin-top: 34px;
}

.hero-trust span {
  border: 0;
  border-left: 2px solid var(--cyan);
  border-radius: 0;
  background: transparent;
  color: var(--text);
  font-family: Arial, sans-serif;
  font-size: 10px;
  letter-spacing: 0.1em;
}

.hero-stats,
.hero-console {
  border-color: var(--line);
  border-radius: 4px;
  box-shadow: none;
}

.hero-stat,
.console-panel,
.console-side {
  background: rgba(255, 255, 255, 0.54);
}

.hero-stat small,
.console-row small,
.compact-label {
  color: var(--muted-2);
  font-family: Arial, sans-serif;
  text-transform: uppercase;
}

.hero-stat strong,
.console-row strong,
.compact-value {
  color: var(--text);
}

.hero-network {
  top: 160px;
  right: 6vw;
}

.hero-network::before,
.hero-network::after {
  border-color: rgba(20, 43, 61, 0.2);
  border-radius: 50%;
}

.hero-network::after {
  border-color: rgba(231, 104, 69, 0.34);
}

.chain-card {
  border-color: var(--text);
  border-radius: 4px;
  background: var(--text);
  box-shadow: 9px 9px 0 rgba(231, 104, 69, 0.75);
}

.chain-card span,
.chain-card small {
  color: #b8c9c8;
  font-family: Arial, sans-serif;
}

.chain-card strong {
  color: var(--blue);
}

.chain-card-side {
  background: var(--cyan);
  box-shadow: 9px 9px 0 var(--blue);
}

.chain-card-side span,
.chain-card-side small,
.chain-card-side strong {
  color: #ffffff;
}

.section {
  background: var(--bg);
  color: var(--text);
}

.section.alt {
  background: var(--bg-2);
}

.section::before {
  background: linear-gradient(120deg, transparent 0 70%, rgba(185, 232, 61, 0.22) 70% 71%, transparent 71%);
}

.section::after {
  border-color: rgba(20, 43, 61, 0.13);
  border-radius: 50%;
}

.section-kicker,
.feature-code {
  color: var(--cyan);
  font-family: Arial, sans-serif;
}

.section-title {
  font-weight: 400;
  letter-spacing: -0.06em;
}

.section-subtitle,
.feature p,
.vip-card p,
.faq-answer,
.step-card p {
  color: var(--muted);
}

.feature,
.panel,
.vip-card,
.faq-item,
.ref-card,
.step-card {
  border-color: var(--line);
  border-radius: 4px;
  background: var(--panel);
  box-shadow: 6px 6px 0 rgba(20, 43, 61, 0.08);
  backdrop-filter: none;
}

.feature:nth-child(even),
.vip-card:nth-child(even) {
  background: var(--text);
  color: #ffffff;
}

.feature:nth-child(even) p,
.vip-card:nth-child(even) p {
  color: #c5d1d0;
}

.contact-band {
  background: var(--cyan);
  color: #ffffff;
}

.contact-panel {
  border: 0;
  border-radius: 4px;
  background: var(--text);
  box-shadow: 10px 10px 0 rgba(20, 43, 61, 0.18);
}

.contact-panel p {
  color: #cad8d7;
}

.modal-backdrop {
  background: rgba(20, 43, 61, 0.72);
}

.modal {
  border: 2px solid var(--text);
  border-radius: 4px;
  background: var(--bg);
  color: var(--text);
  box-shadow: 12px 12px 0 rgba(185, 232, 61, 0.9);
}

.modal-head h3 {
  font-size: 30px;
  font-weight: 400;
}

.modal-close {
  border-color: var(--line);
  background: transparent;
  color: var(--text);
}

.modal p {
  color: var(--muted);
}

.modal-choice {
  border-color: var(--text);
  border-radius: 4px;
  background: #ffffff;
  color: var(--text);
  font-family: Arial, sans-serif;
}

.footer {
  background: var(--text);
  border-top: 0;
  color: #b7c6c4;
}

.footer-logo,
.footer-logo strong,
.footer-column h3 {
  color: #ffffff;
}

@media (max-width: 680px) {
  .hero {
    min-height: 680px;
  }

  .hero-content {
    padding-top: 84px;
  }

  .hero-title {
    font-size: clamp(3.1rem, 15vw, 5rem);
  }

  .hero-network {
    right: -180px;
    top: 220px;
    opacity: 0.36;
    transform: scale(0.78);
    transform-origin: top right;
  }

  .modal {
    width: min(100%, 360px);
  }

  .modal-head {
    padding: 18px 18px 0;
  }

  .modal-head h3 {
    font-size: 25px;
  }

  .modal p {
    margin-inline: 18px;
  }

  .modal-choices {
    padding: 18px;
  }

  .modal-choice {
    min-height: 52px;
    padding: 8px 12px;
    font-size: 14px;
    line-height: 1.2;
    white-space: normal;
  }
}

.footer {
  position: relative;
  overflow: hidden;
  padding: 72px 0 0;
  background: linear-gradient(180deg, rgba(4, 12, 19, 0.98), rgba(6, 16, 25, 0.98));
  color: #a9b7ca;
  border-top: 1px solid rgba(126,224,255,0.18);
}

.footer::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
  background-size: 72px 72px;
  mask-image: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent 85%);
}

.footer-grid {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) minmax(180px, 0.72fr) minmax(240px, 1fr);
  gap: 64px;
  padding-bottom: 54px;
}

.footer-logo {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  color: #ffffff;
}

.footer-logo img {
  width: 48px;
  height: 48px;
  object-fit: contain;
}

.footer-logo strong {
  font-size: 24px;
}

.footer-brand > p {
  max-width: 500px;
  margin: 20px 0 0;
  color: var(--muted);
  line-height: 1.75;
  font-size: 15px;
}

.footer-column h3 {
  margin: 10px 0 20px;
  color: #ffffff;
  font-size: 17px;
}

.footer-links {
  display: grid;
  justify-items: start;
  gap: 10px;
}

.footer-links a {
  color: var(--cyan);
  font-weight: 700;
  transition: color 160ms ease, transform 160ms ease;
}

.footer-links a:hover {
  color: #ffffff;
  transform: translateX(3px);
}

[dir="rtl"] .footer-links a:hover {
  transform: translateX(-3px);
}

.footer-socials {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 24px;
}

.footer-socials button {
  min-height: 44px;
  padding: 0 14px;
  display: inline-flex;
  align-items: center;
  gap: 9px;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  background: rgba(255,255,255,0.04);
  color: #ffffff;
  cursor: pointer;
  font-weight: 800;
}

.footer-socials button:hover {
  border-color: rgba(126,224,255,0.32);
  background: rgba(126,224,255,0.08);
}

.footer-socials img {
  width: 22px;
  height: 22px;
  object-fit: contain;
}

.footer-contact,
.footer-disclaimer {
  margin: 0;
  line-height: 1.7;
}

.footer-contact {
  color: var(--muted);
  overflow-wrap: anywhere;
}

.footer-disclaimer {
  margin-top: 18px;
  font-size: 13px;
}

.footer-trust {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 20px;
}

.footer-trust span {
  padding: 7px 10px;
  border: 1px solid rgba(126,224,255,0.2);
  border-radius: 999px;
  background: rgba(126,224,255,0.08);
  color: var(--cyan);
  font-size: 12px;
  font-weight: 900;
}

.footer-bottom {
  position: relative;
  border-top: 1px solid rgba(255,255,255,0.08);
  background: rgba(0,0,0,0.15);
}

.footer-bottom-inner {
  min-height: 68px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  color: #8998a9;
  font-size: 13px;
}

[dir="rtl"] body {
  text-align: right;
}

[dir="rtl"] .lang-menu {
  right: auto;
  left: 0;
}

[dir="rtl"] .lang-menu button {
  direction: rtl;
  text-align: right;
}

[dir="rtl"] .hero-content,
[dir="rtl"] .section,
[dir="rtl"] .contact-band,
[dir="rtl"] .modal {
  direction: rtl;
}

[dir="rtl"] .hero-network {
  right: auto;
  left: max(12px, calc((100vw - 1180px) / 2));
}

[dir="rtl"] .hero-bg-logo {
  right: auto;
  left: -24px;
}

[dir="rtl"] .section::after {
  right: auto;
  left: max(22px, calc((100vw - 1180px) / 2));
}

[dir="rtl"] .console-row div {
  border-left: 0;
  border-right: 2px solid rgba(126,224,255,0.6);
  padding-left: 0;
  padding-right: 12px;
}

[dir="rtl"] .career-item b {
  text-align: left;
}

@media (max-width: 980px) {
  .nav {
    display: none;
  }

  .hero-bg-logo {
    right: 20px;
    left: auto;
    top: 90px;
    width: min(620px, 70vw);
    opacity: 0.1;
  }

  [dir="rtl"] .hero-bg-logo {
    right: auto;
    left: 20px;
  }

  .hero-network {
    right: -50px;
    top: 150px;
    opacity: 0.38;
  }

  .hero-title {
    font-size: clamp(2.4rem, 5vw, 3.5rem);
  }

  .hero-console,
  .calc-layout,
  .ref-layout,
  .contact-panel {
    grid-template-columns: 1fr;
  }

  .feature-grid,
  .vip-grid,
  .steps {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .footer-grid {
    grid-template-columns: 1fr 1fr;
    gap: 42px;
  }

  .footer-brand {
    grid-column: 1 / -1;
  }
}

@media (max-width: 680px) {
  .container {
    width: min(100% - 22px, 1180px);
  }

  .topbar-inner {
    min-height: 64px;
  }

  .brand span {
    font-size: 18px;
  }

  .brand img {
    width: 38px;
    height: 38px;
  }

  .top-actions .ghost-button {
    display: none;
  }

  .top-actions {
    gap: 8px;
  }

  .lang-button,
  .primary-button {
    padding-inline: 12px;
  }

  .lang-current-icon {
    width: 20px;
    height: 20px;
    flex-basis: 20px;
    font-size: 10px;
  }

  .hero {
    min-height: 720px;
  }

  .hero-bg-logo {
    right: 12px;
    top: 100px;
    width: min(84vw, 430px);
    opacity: 0.12;
  }

  [dir="rtl"] .hero-bg-logo {
    right: auto;
    left: 12px;
  }

  .hero-network {
    display: none;
  }

  .hero-content {
    padding-top: 58px;
  }

  .hero-copy {
    font-size: 16px;
  }

  .hero-stats,
  .console-row,
  .result-grid,
  .tier-list,
  .vip-grid,
  .feature-grid,
  .steps,
  .faq-grid {
    grid-template-columns: 1fr;
  }

  .section {
    padding: 58px 0;
  }

  .section-head {
    display: block;
  }

  .section-title {
    font-size: 28px;
  }

  .career-item {
    grid-template-columns: 1fr;
  }

  .career-item b {
    text-align: left;
  }

  .float-stack {
    right: 12px;
    bottom: 12px;
  }

  .footer {
    padding-top: 54px;
  }

  .footer-grid {
    grid-template-columns: 1fr;
    gap: 34px;
    padding-bottom: 42px;
  }

  .footer-brand {
    grid-column: auto;
  }

  .footer-column h3 {
    margin-top: 0;
  }

  .footer-bottom-inner {
    min-height: 82px;
    padding-block: 16px;
    display: grid;
    justify-items: start;
  }
}

@media (max-width: 420px) {
  .topbar-inner {
    gap: 6px;
  }

  .brand {
    gap: 7px;
  }

  .brand img {
    width: 34px;
    height: 34px;
  }

  .brand span {
    font-size: 16px;
  }

  .top-actions {
    gap: 6px;
  }

  .lang-button,
  .top-start-button {
    min-height: 40px;
    padding-inline: 8px;
    font-size: 13px;
  }

  .lang-current-icon {
    display: none;
  }

  .hero-bg-logo {
    right: 8px;
    width: min(86vw, 360px);
  }

  [dir="rtl"] .hero-bg-logo {
    right: auto;
    left: 8px;
  }
}

:root {
  color-scheme: light;
  --bg: #f7faff;
  --bg-2: #eef4fa;
  --bg-3: #e4edf5;
  --panel: #ffffff;
  --panel-strong: #0b1d33;
  --panel-soft: #f2f6fa;
  --line: #d9e3ed;
  --text: #10243b;
  --muted: #5d7185;
  --muted-2: #7890a3;
  --blue: #1269e8;
  --blue-strong: #0b4fba;
  --cyan: #14a8d7;
  --green: #0c9b6b;
  --amber: #d88b25;
  --shadow: 0 18px 45px rgba(16, 36, 59, 0.08);
  --radius: 12px;
  --radius-sm: 8px;
  --container: min(1180px, calc(100% - 36px));
  font-family: Inter, Manrope, "Segoe UI", Arial, sans-serif;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: Inter, Manrope, "Segoe UI", Arial, sans-serif;
  overflow-x: hidden;
}

button,
input {
  font-family: inherit;
}

.site-shell {
  background: var(--bg);
}

.topbar {
  border-bottom: 1px solid rgba(217, 227, 237, 0.92);
  background: rgba(247, 250, 255, 0.9);
  box-shadow: 0 3px 18px rgba(16, 36, 59, 0.04);
}

.topbar-inner {
  min-height: 74px;
}

.brand {
  color: var(--text);
  font-weight: 800;
  letter-spacing: -0.03em;
}

.brand img {
  width: 40px;
  height: 40px;
  filter: none;
}

.brand span {
  color: var(--text);
  font-size: 20px;
}

.nav {
  gap: 24px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 700;
}

.nav a:hover,
.nav a:focus-visible {
  color: var(--blue);
}

.lang-button,
.ghost-button,
.primary-button,
.plain-button {
  min-height: 44px;
  border-radius: 8px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 750;
  letter-spacing: 0;
  text-transform: none;
}

.lang-button,
.ghost-button {
  border-color: var(--line);
  background: #ffffff;
  color: var(--text);
}

.lang-button:hover,
.ghost-button:hover {
  border-color: #a9c0d6;
  background: var(--bg-2);
}

.primary-button {
  border-color: var(--blue);
  background: var(--blue);
  color: #ffffff;
  box-shadow: 0 8px 18px rgba(18, 105, 232, 0.2);
}

.primary-button:hover {
  border-color: var(--blue-strong);
  background: var(--blue-strong);
  box-shadow: 0 10px 22px rgba(18, 105, 232, 0.26);
}

.lang-current-icon,
.lang-option-icon {
  background: var(--panel-strong);
  border: 0;
}

.lang-menu {
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #ffffff;
  box-shadow: var(--shadow);
}

.lang-menu button {
  color: var(--text);
}

.lang-menu button:hover {
  background: var(--bg-2);
}

.hero {
  min-height: auto;
  overflow: hidden;
  background:
    linear-gradient(180deg, rgba(238, 244, 250, 0.72), rgba(247, 250, 255, 0.98)),
    var(--bg);
  color: var(--text);
}

.hero::before {
  background:
    linear-gradient(rgba(18, 105, 232, 0.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(18, 105, 232, 0.045) 1px, transparent 1px);
  background-size: 36px 36px;
  opacity: 0.75;
}

.hero::after {
  background: var(--line);
}

.hero-grid {
  background:
    radial-gradient(circle at 76% 22%, rgba(20, 168, 215, 0.12), transparent 22%),
    radial-gradient(circle at 95% 66%, rgba(18, 105, 232, 0.08), transparent 26%);
}

.hero-content {
  display: grid;
  grid-template-columns: minmax(0, 0.88fr) minmax(420px, 1.12fr);
  align-items: center;
  gap: 58px;
  padding: 94px 0 78px;
}

.hero-copy-column {
  position: relative;
  z-index: 2;
}

.eyebrow {
  min-height: 0;
  padding: 0;
  border: 0;
  border-radius: 0;
  color: var(--blue);
  background: transparent;
  font-family: inherit;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.eyebrow::before {
  content: "";
  display: inline-block;
  width: 8px;
  height: 8px;
  margin-right: 8px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 0 4px rgba(12, 155, 107, 0.12);
}

.hero-title {
  width: auto;
  margin: 18px 0 0;
  color: var(--text);
  font-size: clamp(2.8rem, 5vw, 5.4rem);
  font-weight: 800;
  letter-spacing: -0.065em;
  line-height: 0.98;
  overflow-wrap: anywhere;
}

.hero-title span {
  display: block;
  color: var(--blue);
  font-style: normal;
}

.hero-copy {
  width: min(540px, 100%);
  margin: 24px 0 0;
  color: var(--muted);
  font-size: 17px;
  line-height: 1.7;
  overflow-wrap: anywhere;
}

.hero-actions {
  margin-top: 30px;
}

.hero-trust {
  display: flex;
  flex-wrap: wrap;
  gap: 18px;
  margin-top: 26px;
}

.hero-trust span {
  display: inline-flex;
  align-items: center;
  min-height: 24px;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0;
  text-transform: none;
}

.status-dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  margin-right: 7px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 0 4px rgba(12, 155, 107, 0.1);
}

.hero-system {
  position: relative;
  z-index: 2;
  padding: 24px;
  border: 1px solid #cddbe8;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.86);
  box-shadow: 0 24px 60px rgba(16, 36, 59, 0.1);
}

.system-header,
.system-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  color: var(--muted-2);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.system-title {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.system-title img {
  width: 20px;
  height: 20px;
  object-fit: contain;
}

.system-visual {
  display: block;
  width: 100%;
  height: 112px;
  margin-top: 18px;
  border: 1px solid #e0eaf2;
  border-radius: 10px;
  object-fit: cover;
  object-position: center;
}

.system-status {
  color: var(--green);
  letter-spacing: 0;
  text-transform: none;
}

.system-flow {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  align-items: center;
  gap: 0;
  margin: 28px 0 30px;
}

.system-node {
  position: relative;
  z-index: 1;
  display: grid;
  justify-items: center;
  gap: 8px;
  text-align: center;
}

.system-icon {
  display: grid;
  place-items: center;
  width: 54px;
  height: 54px;
  border: 1px solid #bcd0e2;
  border-radius: 14px;
  background: #f5f9fc;
  color: var(--blue);
  font-size: 20px;
  font-weight: 850;
  box-shadow: 0 8px 20px rgba(16, 36, 59, 0.08);
}

.system-node strong {
  color: var(--text);
  font-size: 13px;
}

.system-node small {
  color: var(--muted-2);
  font-size: 10px;
  line-height: 1.3;
}

.system-node-accent .system-icon {
  border-color: rgba(18, 105, 232, 0.3);
  background: rgba(18, 105, 232, 0.08);
}

.system-node-success .system-icon {
  border-color: rgba(12, 155, 107, 0.3);
  background: rgba(12, 155, 107, 0.08);
  color: var(--green);
}

.system-connector {
  position: relative;
  height: 1px;
  background: #b9cfe1;
}

.system-connector::after {
  content: ">";
  position: absolute;
  right: -3px;
  top: -10px;
  color: var(--blue);
  font-size: 16px;
  font-weight: 800;
}

.system-connector i {
  position: absolute;
  top: -2px;
  left: 24%;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 0 5px rgba(20, 168, 215, 0.1);
  animation: flow-pulse 2.4s ease-in-out infinite;
}

.system-connector:nth-of-type(4) i {
  animation-delay: 0.8s;
}

.system-connector:nth-of-type(6) i {
  animation-delay: 1.6s;
}

@keyframes flow-pulse {
  0%, 100% { transform: translateX(0); opacity: 0.35; }
  50% { transform: translateX(120px); opacity: 1; }
}

.system-footer {
  justify-content: flex-start;
  gap: 22px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 0;
  text-transform: none;
}

.system-footer b {
  display: inline-block;
  width: 6px;
  height: 6px;
  margin-right: 6px;
  border-radius: 50%;
  background: var(--green);
}

.hero-metrics {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #ffffff;
  box-shadow: var(--shadow);
}

.hero-stat {
  min-height: 88px;
  padding: 18px 20px;
  border-right: 1px solid var(--line);
  background: transparent;
}

.hero-stat:last-child {
  border-right: 0;
}

.hero-stat small,
.console-row small,
.compact-label {
  display: block;
  color: var(--muted-2);
  font-size: 11px;
  font-weight: 750;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.hero-stat strong,
.console-row strong,
.compact-value {
  display: block;
  margin-top: 8px;
  color: var(--text);
  font-size: 17px;
  font-weight: 800;
}

.hero-stat-status strong {
  display: flex;
  align-items: center;
  color: var(--green);
}

.hero-console {
  grid-column: 1 / -1;
  width: auto;
  margin-top: 0;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #ffffff;
  box-shadow: var(--shadow);
}

.console-panel {
  background: #ffffff;
}

.console-title {
  color: var(--text);
  font-size: 12px;
  letter-spacing: 0.04em;
}

.console-row div {
  border-left-color: var(--blue);
}

.console-row strong,
.compact-value {
  color: var(--text);
}

.section {
  padding: 92px 0;
  background: #ffffff;
  color: var(--text);
}

.section.alt {
  background: var(--bg-2);
}

.section::before {
  background: linear-gradient(120deg, transparent 0 78%, rgba(18, 105, 232, 0.035) 78% 78.2%, transparent 78.2%);
}

.section::after {
  width: 180px;
  height: 180px;
  border-color: rgba(18, 105, 232, 0.08);
  border-radius: 50%;
}

.section-head {
  margin-bottom: 34px;
}

.section-kicker,
.feature-code {
  color: var(--blue);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.section-title {
  color: var(--text);
  font-size: clamp(2rem, 3vw, 3rem);
  font-weight: 800;
  letter-spacing: -0.055em;
}

.section-subtitle {
  color: var(--muted);
  line-height: 1.7;
}

.feature-grid {
  gap: 16px;
}

.feature,
.panel,
.vip-card,
.faq-item,
.ref-card,
.step-card {
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #ffffff;
  box-shadow: var(--shadow);
  backdrop-filter: none;
}

.feature {
  min-height: 238px;
  padding: 24px;
}

.feature:nth-child(even),
.vip-card:nth-child(even) {
  background: #ffffff;
  color: var(--text);
}

.feature:nth-child(even) p,
.vip-card:nth-child(even) p {
  color: var(--muted);
}

.feature-icon {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  margin-bottom: 28px;
  border: 1px solid rgba(18, 105, 232, 0.2);
  border-radius: 10px;
  background: rgba(18, 105, 232, 0.08);
  color: var(--blue);
  font-size: 12px;
  font-weight: 850;
}

.feature h3,
.vip-card h3,
.step-card h3,
.ref-card h3 {
  color: var(--text);
}

.feature p,
.vip-card p,
.step-card p,
.ref-card p,
.faq-answer {
  color: var(--muted);
  line-height: 1.7;
}

.calc-layout {
  gap: 18px;
}

.panel {
  padding: 26px;
}

.field label {
  color: var(--text);
  font-weight: 800;
}

.field input {
  border: 1px solid #b9cde0;
  border-radius: 8px;
  background: #f8fbfd;
  color: var(--text);
  box-shadow: inset 0 1px 2px rgba(16, 36, 59, 0.04);
}

.field input:focus {
  border-color: var(--blue);
  outline: 3px solid rgba(18, 105, 232, 0.12);
}

.periods button,
.tier-pill {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #f8fbfd;
  color: var(--muted);
}

.periods button.active,
.tier-pill.active {
  border-color: var(--blue);
  background: rgba(18, 105, 232, 0.09);
  color: var(--blue-strong);
}

.result-grid {
  gap: 12px;
}

.result-card {
  min-height: 112px;
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #f8fbfd;
}

.result-card.highlight {
  border-color: rgba(18, 105, 232, 0.28);
  background: rgba(18, 105, 232, 0.08);
}

.result-card small {
  color: var(--muted-2);
  font-size: 11px;
  font-weight: 750;
  text-transform: uppercase;
}

.result-card strong {
  display: block;
  margin-top: 14px;
  color: var(--text);
  font-size: clamp(1.35rem, 2.2vw, 2rem);
  letter-spacing: -0.04em;
}

.vip-grid {
  gap: 14px;
}

.vip-card {
  position: relative;
  min-height: 228px;
  padding: 22px;
  overflow: hidden;
}

.vip-card::before {
  content: "";
  position: absolute;
  inset: 0 auto 0 0;
  width: 3px;
  background: var(--blue);
}

.vip-card:nth-child(3n)::before {
  background: var(--cyan);
}

.vip-card:nth-child(4n)::before {
  background: var(--green);
}

.vip-rate {
  color: var(--blue-strong);
  font-size: 30px;
  font-weight: 800;
  letter-spacing: -0.06em;
}

.vip-meta {
  border-top-color: var(--line);
  color: var(--muted-2);
}

.vip-meta strong {
  color: var(--text);
}

.ref-layout,
.career-list {
  gap: 16px;
}

.ref-card {
  box-shadow: none;
}

.career-item {
  border-color: var(--line);
  background: #ffffff;
}

.career-item b {
  color: var(--blue-strong);
}

.steps {
  gap: 14px;
}

.step-card {
  position: relative;
  min-height: 200px;
  padding: 24px;
}

.step-card::after {
  content: "";
  position: absolute;
  top: 42px;
  right: -15px;
  width: 16px;
  height: 1px;
  background: #a9c5dc;
}

.step-card:last-child::after {
  display: none;
}

.step-number {
  color: var(--blue);
  font-size: 12px;
  font-weight: 850;
}

.faq-item {
  box-shadow: none;
}

.faq-item summary {
  color: var(--text);
}

.faq-indicator {
  border-color: rgba(18, 105, 232, 0.22);
  background: rgba(18, 105, 232, 0.06);
  color: var(--blue);
}

.contact-band {
  padding: 82px 0;
  background: var(--panel-strong);
  color: #ffffff;
}

.contact-panel {
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.06);
  box-shadow: none;
}

.contact-panel p {
  color: #b8c7d8;
}

.contact-button.ghost-button {
  border-color: rgba(255, 255, 255, 0.25);
  background: transparent;
  color: #ffffff;
}

.float-contact {
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #ffffff;
  box-shadow: var(--shadow);
}

.modal-backdrop {
  background: rgba(7, 25, 46, 0.6);
}

.modal {
  border: 1px solid #cbd9e5;
  border-radius: 14px;
  background: #ffffff;
  color: var(--text);
  box-shadow: 0 28px 80px rgba(7, 25, 46, 0.22);
}

.modal-head h3 {
  color: var(--text);
  font-size: 24px;
}

.modal-close {
  border-color: var(--line);
  background: var(--bg-2);
  color: var(--text);
}

.modal p {
  color: var(--muted);
}

.modal-choice {
  border-color: var(--line);
  border-radius: 8px;
  background: #f7fafd;
  color: var(--text);
}

.modal-choice:hover {
  border-color: rgba(18, 105, 232, 0.45);
  background: rgba(18, 105, 232, 0.06);
}

.footer {
  padding-top: 72px;
  background: #08182b;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  color: #a9bacd;
}

.footer-logo,
.footer-logo strong,
.footer-column h3 {
  color: #ffffff;
}

.footer-brand > p,
.footer-contact {
  color: #a9bacd;
}

.footer-links a {
  color: #c8d8e8;
}

.footer-links a:hover {
  color: #ffffff;
}

.footer-socials button {
  border-color: rgba(255, 255, 255, 0.14);
  background: rgba(255, 255, 255, 0.06);
  color: #ffffff;
}

@media (max-width: 980px) {
  .hero-content {
    grid-template-columns: 1fr;
    gap: 36px;
  }

  .hero-copy {
    max-width: 680px;
  }

  .hero-system {
    width: min(760px, 100%);
  }

  .hero-metrics,
  .hero-console {
    grid-column: auto;
  }

  .hero-metrics,
  .hero-console {
    width: 100%;
  }
}

@media (max-width: 680px) {
  .container {
    width: min(100% - 24px, 1180px);
  }

  .topbar-inner {
    min-height: 66px;
  }

  .hero-content {
    gap: 28px;
    padding: 66px 0 54px;
  }

  .hero-title {
    font-size: clamp(2.55rem, 13vw, 4.5rem);
  }

  .hero-copy {
    font-size: 15px;
  }

  .hero-system {
    padding: 16px;
  }

  .system-visual {
    height: 76px;
    margin-top: 14px;
  }

  .system-flow {
    grid-template-columns: 1fr;
    gap: 12px;
    margin: 30px 0;
  }

  .system-connector {
    width: 1px;
    height: 20px;
    margin: 0 auto;
  }

  .system-connector::after {
    right: auto;
    top: 12px;
    left: -5px;
    content: "v";
    font-size: 12px;
  }

  .system-connector i {
    top: 8px;
    left: -2px;
    animation-name: flow-pulse-mobile;
  }

  @keyframes flow-pulse-mobile {
    0%, 100% { transform: translateY(0); opacity: 0.35; }
    50% { transform: translateY(12px); opacity: 1; }
  }

  .system-footer {
    display: grid;
    gap: 8px;
  }

  .hero-metrics {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .hero-stat:nth-child(2) {
    border-right: 0;
  }

  .hero-stat:nth-child(-n + 2) {
    border-bottom: 1px solid var(--line);
  }

  .hero-console {

.step-card,

  top: -8px;
  right: -8px;
  width: 7px;

  box-shadow: 0 0 0 4px rgba(20, 168, 215, 0.1);

.feature-icon svg {

  stroke-linejoin: round;

  justify-content: space-between;
  gap: 14px;

}

.projection-heading span {
  color: var(--text);

}

.projection-heading small {
  color: var(--muted-2);
  font-size: 11px;

}

.projection-svg {
  display: block;
  width: 100%;
  height: auto;
  min-height: 142px;
}

.projection-grid-line {
  fill: none;
  stroke: #dbe7f1;
  stroke-width: 1;
}

.projection-area {
  fill: url(#projectionFill);
}

.projection-line {
  fill: none;
  stroke: var(--blue);
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 2.5;
}

.projection-point {
  fill: #ffffff;
  stroke: var(--blue);
  stroke-width: 2;
}

.projection-svg text {
  fill: var(--muted-2);
  font-family: inherit;
  font-size: 10px;
  font-weight: 700;
}

.vip-progress {
  position: relative;
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 0;
  margin: 0 0 20px;
  padding: 0 22px;
}

.vip-progress::before {
  content: "";
  position: absolute;

  font-weight: 800;

  font-size: 12px;
}

.security-boundary strong {
  color: var(--text);
  font-weight: 750;
}

.step-card {
  z-index: 1;
}

.step-glyph {

  place-items: center;
  width: 42px;
  height: 42px;

  color: var(--blue);
  font-size: 16px;
  font-weight: 850;

.contact-panel .section-title {
  color: #f8fbff;

    display: grid;

  }

    text-align: left;

    padding: 0;

    width: 18px;

    right: -1px;

    border-top: 1px solid #8eb0ca;
    border-right: 0;
    border-bottom: 0;
    transform: rotate(45deg);

    display: grid;
    gap: 6px;
  }

  .feature,
  .panel,
  .vip-card,
  .ref-card,
  .step-card,
  .faq-item {
    transition: none;

const langMap = {};

function normalizeLang(lang) {
  const l = (lang || "").trim();
  if (SUPPORTED.includes(l)) return l;
  if (langMap[l]) return langMap[l];
  const base = l.split("-")[0];
  if (langMap[base]) return langMap[base];
  return DEFAULT_LANG;
}

function getStoredLang() {
  try { return localStorage.getItem(LANG_STORAGE_KEY); } catch { return null; }
}
function setStoredLang(lang) {
  try { localStorage.setItem(LANG_STORAGE_KEY, lang); } catch {}
}

async function loadLocale(lang) {
  const dict = LOCALES[lang] || LOCALES[DEFAULT_LANG];
  if (!dict) throw new Error(`Failed to load locale: ${lang}`);
  return dict;
}

function t(key) {
  return window.__i18n?.dict?.[key] ?? key;
}

function applyDocumentLanguage(lang) {
  document.documentElement.setAttribute("lang", lang);
  document.documentElement.setAttribute("dir", RTL_LANGS.has(lang) ? "rtl" : "ltr");
}

async function initI18n(options = {}) {
  const prefer = options.lang || getStoredLang() || DEFAULT_LANG;
  const lang = normalizeLang(prefer);

  let dict;
  try { dict = await loadLocale(lang); }
  catch { dict = await loadLocale(DEFAULT_LANG); }

  applyDocumentLanguage(lang);
  setStoredLang(lang);

  window.__i18n = {
    lang,
    dict,
    async setLang(next) {
      const n = normalizeLang(next);
      const d = await loadLocale(n);
      window.__i18n.lang = n;
      window.__i18n.dict = d;
      applyDocumentLanguage(n);
      setStoredLang(n);
      window.dispatchEvent(new CustomEvent("i18n:changed"));
    }
  };

  return window.__i18n;
}

  <script>
const CONTACT_LINKS = {
  telegram: "https://t.me/POS_Service1_Bot"
};

const TG_CODE_KEY = "tg_code";
const TG_CODE_TIME_KEY = "tg_code_time";
const TG_CODE_TTL_MS = 24 * 60 * 60 * 1000;

function generateTgCode() {
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
  const part1 = Array.from({ length: 8 }, () => chars[Math.floor(Math.random() * chars.length)]).join("");
  const part2 = Array.from({ length: 6 }, () => chars[Math.floor(Math.random() * chars.length)]).join("");
  return `TG-${part1}-${part2}`;
}

function getOrCreateTgCode() {
  const now = Date.now();

  try {
    const storedCode = localStorage.getItem(TG_CODE_KEY);
    const storedAt = Number(localStorage.getItem(TG_CODE_TIME_KEY) || 0);

    if (storedCode && now - storedAt < TG_CODE_TTL_MS) {
      return storedCode;
    }

    const code = generateTgCode();
    localStorage.setItem(TG_CODE_KEY, code);
    localStorage.setItem(TG_CODE_TIME_KEY, String(now));
    return code;
  } catch {
    return generateTgCode();
  }
}

function appendParam(url, key, value) {
  try {
    const parsed = new URL(url, window.location.href);
    parsed.searchParams.set(key, value);
    return parsed.toString();
  } catch {
    const separator = url.includes("?") ? "&" : "?";
    return `${url}${separator}${encodeURIComponent(key)}=${encodeURIComponent(value)}`;
  }
}

function normalizeChannel(channel) {
  if (channel === "tg") return "telegram";
  return channel;
}

function trackTelegramClick(channel, code = getOrCreateTgCode()) {
  if (typeof window.fbq === "function") {
    window.fbq("trackCustom", "TelegramClick", {
      channel,
      code,
      page_url: window.location.href
    });
  }
}

function buildContactUrl(channel, code) {
  const normalized = normalizeChannel(channel);
  const url = CONTACT_LINKS[normalized];

  if (!url) return "";
  if (normalized === "telegram") return appendParam(url, "start", code);
  return url;
}

function openContact(channel) {
  const normalized = normalizeChannel(channel);
  const code = getOrCreateTgCode();
  const url = buildContactUrl(normalized, code);

  if (!url) return;

  trackTelegramClick(normalized, code);
  window.open(url, "_blank", "noopener,noreferrer");
}

// PageView is fired by the HTML Meta Pixel snippet. These keep existing imports compatible.
function trackPageView() {}
function trackButtonClick() {}
function trackFormSubmit() {}
function trackCalculatorInteraction() {}

function trackContactClick(contactType) {
  openContact(contactType);
}

function trackEvent(eventName, customData = {}) {
  if (eventName === "TelegramClick") {
    trackTelegramClick(customData.channel || "contact", customData.code);
  }
}

function fmt(value, digits = 2) {
  return Number(value || 0).toLocaleString(undefined, {
    minimumFractionDigits: digits,
    maximumFractionDigits: digits
  });
}

function compact(value) {
  return Number(value || 0).toLocaleString(undefined, {
    maximumFractionDigits: 0
  });
}

function rateText(rate) {
  return `${(rate * 100).toFixed(2)}%`;
}

function rangeText(tier) {
  const max = tier.max === Infinity ? "300,000+" : compact(tier.max);
  return `${compact(tier.min)} - ${max} USDC`;
}

function compound(amount, rate, days) {
  return amount * Math.pow(1 + rate, days);
}

function getTier(amount) {
  return tiers.find((tier) => amount >= tier.min && amount <= tier.max) || tiers[0];
}

function projectionSvg() {
  const points = [30, 60, 90].map((days) => ({
    days,
    value: compound(state.amount, getTier(state.amount).rate, days)
  }));
  const maxValue = points[2].value;
  const minValue = state.amount;
  const range = Math.max(maxValue - minValue, 1);
  const coords = points.map((point) => ({
    x: 32 + ((point.days - 30) / 60) * 236,
    y: 102 - ((point.value - minValue) / range) * 66
  }));
  const line = coords.map((point) => `${point.x},${point.y}`).join(" ");

  return `

      <path class="projection-area" d="M32 102 L${coords[0].x} ${coords[0].y} L${coords[1].x} ${coords[1].y} L${coords[2].x} ${coords[2].y} L268 102 Z" />
      <polyline class="projection-line" points="${line}" />
      ${coords.map((point) => `<circle class="projection-point" cx="${point.x}" cy="${point.y}" r="4" />`).join("")}

            <div class="security-item"><span class="security-glyph">W</span><div><strong>${t("security.wallet")}</strong><p>${t("security.walletDesc")}</p></div></div>
            <div class="security-item"><span class="security-glyph">$</span><div><strong>${t("security.asset")}</strong><p>${t("security.assetDesc")}</p></div></div>
          </article>
          <div class="security-route" aria-label="Wallet to on-chain process">
            <span>Wallet</span><i></i><span>Asset</span><i></i><span>Polygon</span><i></i><span>Process</span>
          </div>
          <article class="security-column security-system-column">
            <span class="security-label">${t("security.system")}</span>
            <div class="security-item"><span class="security-glyph">N</span><div><strong>${t("security.network")}</strong><p>${t("security.networkDesc")}</p></div></div>
            <div class="security-item"><span class="security-glyph">A</span><div><strong>${t("security.workflow")}</strong><p>${t("security.workflowDesc")}</p></div></div>
          </article>
          <div class="security-boundary"><span>${t("security.boundary")}</span><strong>${t("security.boundaryText")}</strong></div>
        </div>
      </div>
    </section>
  `;
}

function how() {
  const steps = [
    ["01", "how.s1.t", "how.s1.d"],
    ["02", "how.s2.t", "how.s2.d"],
    ["03", "how.s3.t", "how.s3.d"]
  ];

  return `
    <section class="section" id="how">
      <div class="container">
        <div class="section-head">
          <div>
            <p class="section-kicker">${t("how.title")}</p>
            <h2 class="section-title">${t("how.subtitle")}</h2>
          </div>
        </div>
        <div class="steps">
          ${steps.map(([num, title, desc]) => `
            <article class="step-card">
              <div class="step-number">${num}</div>
              <span class="step-glyph" aria-hidden="true">${num === "01" ? "W" : num === "02" ? "$" : "A"}</span>
              <h3>${t(title)}</h3>
              <p>${t(desc)}</p>
            </article>
          `).join("")}
        </div>
      </div>
    </section>
  `;
}

function faq() {
  const items = [
    ["faq.q1", "faq.a1"],
    ["faq.q2", "faq.a2"],
    ["faq.q3", "faq.a3"],
    ["faq.q4", "faq.a4"],
    ["faq.q5", "faq.a5"],
    ["faq.q6", "faq.a6"]
  ];

  return `
    <section class="section alt" id="faq">
      <div class="container">
        <div class="section-head">
          <div>
            <p class="section-kicker">${t("faq.title")}</p>
            <h2 class="section-title">${t("faq.subtitle")}</h2>
          </div>
        </div>
        <div class="faq-grid">
          ${items.map(([question, answer]) => `
            <details class="faq-item">
              <summary>
                <span class="faq-question">${t(question)}</span>
                <span class="faq-indicator" aria-hidden="true"></span>
              </summary>
              <div class="faq-answer">
                <p>${t(answer)}</p>
              </div>
            </details>
          `).join("")}
        </div>
      </div>
    </section>
  `;
}

function contact() {
  return `
    <section class="contact-band" id="contact">
      <div class="container">
        <div class="contact-panel">
          <div>
            <h2 class="section-title">${t("contact.title")}</h2>
            <p>${t("contact.subtitle")}</p>
          </div>
          <div class="contact-buttons">
            <a class="primary-button contact-button" href="#contact" data-contact="telegram">
              <img src="./images/telegram.png" alt="" aria-hidden="true" />
              ${t("cta.contactTG")}
            </a>
          </div>
        </div>
      </div>
    </section>
  `;
}

function floatingContacts() {
  return `
    <div class="float-stack" aria-label="Contact options">
      <button class="float-contact" type="button" data-contact="telegram" aria-label="Telegram">
        <img src="./images/telegram.png" alt="" />
      </button>
    </div>
  `;
}

function footer() {
  const year = new Date().getFullYear();

  return `
    <footer class="footer">
      <div class="container footer-grid">
        <section class="footer-brand">
          <a class="footer-logo" href="#top" aria-label="CGWatcher">
            <img src="./images/12.jpg" alt="" aria-hidden="true" />
            <strong>${t("brand.name")}</strong>
          </a>
          <p>${t("hero.desc")}</p>
          <div class="footer-socials">
            <button type="button" data-contact="telegram" aria-label="Telegram">
              <img src="./images/telegram.png" alt="" aria-hidden="true" />
              <span>Telegram</span>
            </button>
          </div>
        </section>

        <section class="footer-column">
          <h3>${t("footer.quickLinks")}</h3>
          <nav class="footer-links" aria-label="${t("footer.quickLinks")}">
            <a href="#top">${t("footer.backToTop")}</a>
            <a href="#features">${t("nav.features")}</a>
            <a href="#calculator">${t("nav.calculator")}</a>
            <a href="#vip">${t("nav.vip")}</a>
            <a href="#how">${t("nav.how")}</a>
            <a href="#faq">${t("nav.faq")}</a>
          </nav>
        </section>

        <section class="footer-column">
          <h3>${t("footer.contactUs")}</h3>
          <p class="footer-contact">${t("footer.contact")}</p>
          <div class="footer-trust" aria-label="Platform">
            <span>Polygon</span>
            <span>USDC</span>
            <span>24/7</span>
          </div>
        </section>
      </div>

      <div class="footer-bottom">
        <div class="container footer-bottom-inner">
          <span>© ${year} ${t("brand.name")} · ${t("footer.rights")}</span>
          <span>${t("footer.poweredBy")}</span>
        </div>
      </div>
    </footer>
  `;
}

function render() {
  document.title = t("meta.title") || "CGWatcher";
  $("#app").innerHTML = `
    <div class="site-shell">
      ${nav()}
      ${hero()}
      ${features()}
      ${calculator()}
      ${vip()}
      ${referral()}
      ${security()}
      ${how()}
      ${faq()}
      ${contact()}
      ${footer()}
      ${floatingContacts()}
    </div>
  `;

  bindActions();
  updateCalculator();
}

function bindActions() {
  document.querySelectorAll("[data-contact]").forEach((node) => {
    node.addEventListener("click", (event) => {
      event.preventDefault();
      k2();
    });
  });

  document.querySelectorAll("[data-open-contact-modal]").forEach((button) => {
    button.addEventListener("click", () => k2());
  });

  const input = $("#amountInput");
  if (input) {
    input.addEventListener("input", () => {
      const raw = Number(input.value || 0);
      state.amount = Math.min(9999999, Math.max(10, raw || 10));
      updateCalculator();
    });
  }

  document.querySelectorAll("[data-period]").forEach((button) => {
    button.addEventListener("click", () => {
      state.days = Number(button.dataset.period);
      document.querySelectorAll("[data-period]").forEach((item) => item.classList.remove("active"));
      button.classList.add("active");
      updateCalculator();
    });
  });
}

function updateCalculator() {
  const tier = getTier(state.amount);
  const total = compound(state.amount, tier.rate, state.days);
  const earnings = total - state.amount;

  const amountMirror = $("#amountMirror");
  const tierName = $("#tierName");
  const tierRate = $("#tierRate");
  const earningsValue = $("#earningsValue");
  const totalValue = $("#totalValue");
  const daysLabel = $("#daysLabel");

  if (amountMirror) amountMirror.textContent = `${compact(state.amount)} USDC`;
  if (tierName) tierName.textContent = tier.name;
  if (tierRate) tierRate.textContent = rateText(tier.rate);
  if (earningsValue) earningsValue.textContent = `${fmt(earnings)} USDC`;
  if (totalValue) totalValue.textContent = `${fmt(total)} USDC`;
  if (daysLabel) daysLabel.textContent = String(state.days);
  const projectionChart = $("#projectionChart");
  if (projectionChart) projectionChart.innerHTML = projectionSvg();

  document.querySelectorAll(".tier-pill").forEach((node) => {
    const isActive = node.querySelector("strong")?.textContent === tier.name;
    node.classList.toggle("active", isActive);
  });
}

function contactModalHtml() {
  return `
    <div class="modal-backdrop" id="contactModal">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="contactModalTitle">
        <div class="modal-head">
          <h3 id="contactModalTitle">${t("contact.title")}</h3>
          <button class="modal-close" type="button" data-modal-close aria-label="Close">x</button>
        </div>
        <p>${t("contact.subtitle")}</p>
        <div class="modal-choices">
          <button class="modal-choice" type="button" data-modal-contact="telegram">
            <img src="./images/telegram.png" alt="" aria-hidden="true" />
            <span>${t("cta.contactTG")}</span>
          </button>
        </div>
      </div>
    </div>
  `;
}

function showContactModal(force = false) {
  if (contactPopupShown && !force) return;
  contactPopupShown = true;
  contactModalVisible = true;

  $("#contactModal")?.remove();
  document.body.insertAdjacentHTML("beforeend", contactModalHtml());

  $("#contactModal")?.addEventListener("click", (event) => {
    if (event.target.id === "contactModal") closeContactModal();
  });

  document.querySelectorAll("[data-modal-close]").forEach((button) => {
    button.addEventListener("click", closeContactModal);
  });

  document.querySelectorAll("[data-modal-contact]").forEach((button) => {
    button.addEventListener("click", () => {
      k2();
      closeContactModal();
    });
  });
}

function closeContactModal() {
  contactModalVisible = false;
  $("#contactModal")?.remove();
}

function scheduleContactModal() {
  if (contactPopupTimer) clearTimeout(contactPopupTimer);
  contactPopupTimer = setTimeout(() => showContactModal(), 8000);
}

async function init() {
  if (document.readyState === "loading") {
    await new Promise((resolve) => document.addEventListener("DOMContentLoaded", resolve, { once: true }));
  }

  await initI18n();
  render();
  trackPageView();
  scheduleContactModal();

  const loading = $("#loading");
  if (loading) {
    loading.classList.add("hidden");
    setTimeout(() => loading.remove(), 220);
  }

  window.addEventListener("i18n:changed", () => {
    render();
    if (contactModalVisible) showContactModal(true);
  });
}

init().catch((error) => {
  console.error(error);
  document.body.innerHTML = `<main style="padding:40px;font-family:Arial,sans-serif"><h1>CGWatcher</h1><p>Failed to load the page. Please refresh.</p></main>`;
});
  </script>
</body>
</html>
