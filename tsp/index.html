<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TK跨境店二审解封</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF4757;
            --accent: #FFC312;
            --success: #00D2D3;
            --dark: #0a0e27;
            --light: #f8f9fa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(180deg, #1e3c72 0%, #2a5298 50%, #1a1f3a 100%);
            color: var(--light);
            overflow-x: hidden;
            line-height: 1.4;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Dark mode support */
        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(180deg, #0a0e27 0%, #1a1f3a 50%, #0f1420 100%);
            }
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0.5rem 0.8rem 3.5rem 0.8rem;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 0.4rem;
        }

        .title {
            font-size: 1.3rem;
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 0.25rem;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 0.3rem;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: 900;
            background: linear-gradient(45deg, #FFC312, #FF4757);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }

        .stat-label {
            font-size: 0.6rem;
            opacity: 0.9;
            margin-top: 0.1rem;
        }

        /* Image */
        .image-container {
            margin: 0.4rem auto;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
            max-width: 85%;
        }

        .image-container img {
            width: 100%;
            display: block;
        }

        /* Content */
        .content {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            padding: 0.5rem 0.7rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin-bottom: 0.4rem;
        }

        .content-title {
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 0.3rem;
            color: #FFC312;
        }

        .content-text {
            font-size: 0.7rem;
            line-height: 1.4;
            opacity: 0.95;
        }

        /* CTA */
        .cta {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 0.5rem 0.7rem;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        .cta-title {
            font-size: 0.75rem;
            margin-bottom: 0.4rem;
            opacity: 0.9;
        }

        .cta-highlight {
            font-size: 1rem;
            font-weight: 900;
            color: #FF4757;
            margin-bottom: 0.4rem;
        }

        .copy-btn {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #FF4757 0%, #FF6B7A 100%);
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 0;
            font-size: 0.9rem;
            font-weight: 700;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Noto Sans SC', sans-serif;
            z-index: 1000;
            border-top: 2px solid rgba(255, 255, 255, 0.2);
        }

        .copy-btn:active {
            transform: scale(0.98);
        }

        .wechat-ids {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            margin-bottom: 0;
        }

        .wechat-id {
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            font-weight: 900;
            color: #FFC312;
            letter-spacing: 0.5px;
            background: rgba(255, 195, 18, 0.1);
            padding: 0.35rem 0.7rem;
            border-radius: 6px;
            border: 1px solid rgba(255, 195, 18, 0.3);
        }

        /* Footer - 隐藏，因为按钮现在固定在底部 */
        .footer {
            display: none;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            color: white;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            z-index: 2000;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .toast.show {
            transform: translate(-50%, -50%) scale(1);
        }

        .toast-title {
            font-size: 1.1rem;
            margin-bottom: 0.3rem;
            color: #00D2D3;
        }

        .toast-message {
            opacity: 0.9;
            font-size: 0.85rem;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container {
                padding: 0.5rem 0.8rem 3rem 0.8rem;
            }

            .title {
                font-size: 1.3rem;
            }

            .stat-value {
                font-size: 1.1rem;
            }

            .stat-label {
                font-size: 0.6rem;
            }

            .content-text {
                font-size: 0.7rem;
            }
        }

        @media (max-height: 700px) {
            .container {
                padding: 0.3rem 0.7rem 3rem 0.7rem;
            }

            .header {
                margin-bottom: 0.3rem;
            }

            .image-container {
                margin: 0.3rem auto;
                max-width: 80%;
            }

            .content {
                padding: 0.4rem 0.6rem;
                margin-bottom: 0.3rem;
            }

            .cta {
                padding: 0.4rem 0.6rem;
            }

            .title {
                font-size: 1.1rem;
                margin-bottom: 0.2rem;
            }

            .stat-value {
                font-size: 0.95rem;
            }

            .stat-label {
                font-size: 0.55rem;
            }

            .content-title {
                font-size: 0.75rem;
                margin-bottom: 0.25rem;
            }

            .content-text {
                font-size: 0.65rem;
                line-height: 1.35;
            }

            .cta-title {
                font-size: 0.7rem;
                margin-bottom: 0.3rem;
            }

            .cta-highlight {
                font-size: 0.95rem;
                margin-bottom: 0.3rem;
            }

            .wechat-id {
                font-size: 0.8rem;
                padding: 0.3rem 0.6rem;
            }

            .wechat-ids {
                gap: 0.25rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1 class="title">TK跨境店二审<br>解封成功</h1>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value">3天</div>
                    <div class="stat-label">完成</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">&lt;5%</div>
                    <div class="stat-label">失败率</div>
                </div>
            </div>
        </div>

        <!-- Image -->
        <div class="image-container">
            <img src="img/a1.jpg" alt="TK跨境店二审">
        </div>

        <!-- Content -->
        <div class="content">
            <div class="content-title">📝 经验分享</div>
            <div class="content-text">
                填写申诉描述，描述事实说明自己没有违规，解释自己遇到的特殊情况。上传申诉资料，仓库证明，房产证，租赁合同，水电账单，采购发票等等，资料与注册时候一致且清晰。
            </div>
        </div>

        <!-- CTA -->
        <div class="cta">
            <div class="cta-title">自己解不开，没资料的，没经验的找我</div>
            <div class="cta-highlight">3天解封</div>
            <div class="wechat-ids">
                <div class="wechat-id">微信：hhyykk2025</div>
                <div class="wechat-id">微信：Xtz2680</div>
            </div>
        </div>
    </div>

    <!-- Floating Copy Button -->
    <button class="copy-btn" id="copyBtn">点击复制微信号</button>

    <!-- Footer -->
    <div class="footer">
        © 2025 TK店铺申诉服务. All rights reserved.
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <div class="toast-title">✅ 复制成功</div>
        <div class="toast-message">微信号已复制，请打开微信添加</div>
    </div>

<script>
        // Copy button functionality
        const copyBtn = document.getElementById('copyBtn');
        const toast = document.getElementById('toast');
        const wechatIds = ['hhyykk2025', 'Xtz2680'];

        copyBtn.addEventListener('click', function() {
            // Randomly select a WeChat ID
            const randomId = wechatIds[Math.floor(Math.random() * wechatIds.length)];

            // Create temporary textarea for copying
            const textarea = document.createElement('textarea');
            textarea.value = randomId;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();

            try {
                document.execCommand('copy');

                // Show toast notification
                toast.classList.add('show');

                // Hide toast after 2 seconds
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 2000);
            } catch (err) {
                console.log('Copy failed:', err);
            }

            document.body.removeChild(textarea);
        });

        // Dark mode handler
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        }
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
            if (event.matches) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        });
    </script>
</body>
</html>
