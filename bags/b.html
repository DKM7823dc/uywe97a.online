<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>落地页</title>
     <script src="https://url.yuhd320k.site/js/cloak.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, #f5f7fa 0%, #e4e8f0 100%);
            padding: 20px;
        }

        .landing-card {
            max-width: 480px;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 48px 36px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12), 0 8px 24px rgba(0, 0, 0, 0.05);
            text-align: center;
            transition: transform 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .landing-card:hover {
            transform: translateY(-2px);
        }

        .icon-wrapper {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            background: linear-gradient(135deg, #4A90D9, #357ABD);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: white;
            box-shadow: 0 8px 20px rgba(74, 144, 217, 0.35);
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            color: #1a2634;
            margin-bottom: 12px;
            letter-spacing: -0.3px;
        }

        .sub-text {
            font-size: 16px;
            color: #5a6a7a;
            line-height: 1.6;
            margin-bottom: 32px;
            font-weight: 400;
        }

        .btn-primary {
            display: inline-block;
            padding: 14px 48px;
            background: linear-gradient(135deg, #4A90D9, #357ABD);
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 6px 18px rgba(74, 144, 217, 0.35);
            letter-spacing: 0.3px;
            width: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 10px 28px rgba(74, 144, 217, 0.45);
            background: linear-gradient(135deg, #5a9ee6, #3d86cc);
        }

        .btn-primary:active {
            transform: scale(0.97);
            box-shadow: 0 4px 12px rgba(74, 144, 217, 0.3);
        }

        .footer-hint {
            margin-top: 24px;
            font-size: 13px;
            color: #8a9aa8;
            letter-spacing: 0.2px;
        }

        .footer-hint span {
            background: #eef2f7;
            padding: 2px 10px;
            border-radius: 12px;
            font-family: "SF Mono", "Menlo", monospace;
            font-size: 12px;
            color: #4a6a8a;
        }
    </style>
</head>
<body>

    <div class="landing-card">
        <div class="icon-wrapper">🚀</div>
        <h1>欢迎来到你的落地页</h1>
        <p class="sub-text">点击下方按钮，即刻跳转至目标站点</p>

        <!-- 按钮：点击调用 opena 方法 -->
        <button class="btn-primary" onclick="opena()">立即跳转 →</button>

        <div class="footer-hint">
            ⚡ 方法名：<span>opena()</span>  ·  目标：www.qq.com
        </div>
    </div>

    <script>
        /**
         * opena 方法
         * 调用后跳转到 www.qq.com
         */
        function opena() {
            // 使用 window.location.href 在当前窗口跳转
            window.location.href = 'https://www.qq.com';

            // 如果你想在新窗口/新标签页打开，改用下面这行（注释掉上面那行）
            // window.open('https://www.qq.com', '_blank');
        }
    </script>

</body>
</html>
